name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

env:
  GOFLAGS: -mod=readonly
  REGISTRY: quay.io
  # REGISTRY: index.docker.io/v1/
  REPO_NAME: bgruening/involucro
  # REPO_NAME: involucro/tool

jobs:
  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            filename: involucro
          - name: macos
            os: macos-latest
            filename: involucro.darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and build
        env:
          MODE: unit
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docker diagnostics
        run: |
          docker version
          docker info
      - name: Test, build, and wrap
        env:
          MODE: integration
          FILENAME: involucro
        run: ./ci/build.sh

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - integration
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux/amd64 binary
        env:
          MODE: linux-amd64
          FILENAME: involucro
        run: ./ci/build.sh
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: $oauthtoken
          # username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.OAUTH_TOKEN }}
          # password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, Wrap and Push multi-arch images
        env:
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          INVOLUCRO_AUTH: https://$oauthtoken:${{ secrets.OAUTH_TOKEN }}@${{ env.REGISTRY }}
          # INVOLUCRO_AUTH: https://${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}@index.docker.io/v1/
          # Work around go-dockerclient choosing the minimum option version (1.32)
          # for platform imports; Docker 29 rejects API versions below 1.44.
          DOCKER_API_VERSION: "1.44"
        run: |
          # Setup directories for each architecture
          mkdir -p docker-context/amd64 docker-context/arm64 docker-context/armv7 docker-context/riscv64

          # 1. Prepare amd64 (already built)
          cp involucro docker-context/amd64/involucro

          # 2. Build and prepare arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o docker-context/arm64/involucro -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro

          # 3. Build and prepare armv7
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o docker-context/armv7/involucro -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro

          # 4. Build and prepare riscv64
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -o docker-context/riscv64/involucro -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro

          # Build and Push each architecture using Involucro
          for arch in amd64 arm64 armv7 riscv64; do
            echo "Wrapping and Pushing $arch..."
            TARGETARCH=$arch ./involucro wrap push
          done

          # Confirm the pushed image configs match the architectures we will publish in the manifest.
          test "$(docker image inspect ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-amd64 --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          test "$(docker image inspect ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-armv7 --format '{{.Os}}/{{.Architecture}}/{{.Variant}}')" = "linux/arm/v7"
          test "$(docker image inspect ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-riscv64 --format '{{.Os}}/{{.Architecture}}')" = "linux/riscv64"

          # Create and push the manifest list using the Docker CLI
          # These tags must already exist in the registry (pushed by 'involucro push' above)
          docker manifest create ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG} \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-amd64 \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-arm64 \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-armv7 \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-riscv64

          docker manifest annotate ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-amd64 --os linux --arch amd64
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-arm64 --os linux --arch arm64
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-armv7 --os linux --arch arm --variant v7
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}-riscv64 --os linux --arch riscv64

          docker manifest push ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${IMAGE_TAG}
  windows:
    name: Windows amd64
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build version resources
        run: |
          New-Item -ItemType Directory -Force .bin | Out-Null
          $env:GOFLAGS = ""
          $env:GOBIN = "$(Get-Location)\.bin"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          & ".\.bin\goversioninfo.exe" "-product-version=$(git describe --tags --always)"
      - name: Build
        run: |
          go build -o involucro.exe -ldflags "-s -w -X github.com/involucro/involucro/app.version=$(git describe --tags --always)" ./cmd/involucro
          ./involucro.exe --version
      - name: Test
        run: go test ./internal/... ./auth -v

  cross-build:
    name: Cross-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            mode: windows-amd64
            artifacts: involucro.exe
          - name: linux-amd64
            mode: linux-amd64
            filename: involucro.linux-amd64
            artifacts: involucro.linux-amd64
          - name: linux-arm64
            mode: linux-arm64
            filename: involucro.linux-arm64
            artifacts: involucro.linux-arm64
          - name: linux-arm-v7
            mode: linux-arm-v7
            filename: involucro.linux-armv7
            artifacts: involucro.linux-armv7
          - name: linux-riscv64
            mode: linux-riscv64
            filename: involucro.linux-riscv64
            artifacts: involucro.linux-riscv64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          MODE: ${{ matrix.mode }}
          FILENAME: ${{ matrix.filename }}
        run: ./ci/build.sh
      - name: Collect artifacts
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          mkdir -p ci-artifacts
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            cp "$artifact" ci-artifacts/
          done <<EOF
          $ARTIFACTS
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ci-artifacts/*
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - docker-image
      - windows
      - cross-build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find dist -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes "Release $TAG"
          fi
